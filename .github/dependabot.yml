version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 5
    groups:
      angular-framework:
        patterns:
          - "@angular/*"
          - "zone.js"
          - "rxjs"
      supabase:
        patterns:
          - "@supabase/*"
      dev-tooling:
        patterns:
          - "eslint*"
          - "@types/*"
          - "playwright*"
          - "@playwright/*"
          - "prettier*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
