<div class="relative w-full max-w-2xl">
  <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
    <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
  </div>
  <input 
    type="text" 
    (keyup)="onSearch($event)"
    class="block w-full pl-12 pr-4 py-4 bg-slate-900 border border-slate-700 rounded-2xl text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-base shadow-sm"
    placeholder="Buscar prompts, arquitecturas, migraciones..."
  >
  <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none hidden md:flex">
    <span class="text-xs text-slate-500 font-medium bg-slate-800 px-2 py-1 rounded">⌘K / Ctrl+K</span>
  </div>
</div>
