<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
  <div class="flex items-center justify-between mb-6">
    <h3 class="font-bold text-white uppercase tracking-wide text-sm flex items-center gap-2">
      <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
      </svg>
      Filtros
    </h3>
    <button (click)="clearFilters()" *ngIf="activeTypes.size > 0 || activeDifficulties.size > 0" class="text-xs text-slate-400 hover:text-white underline">
      Limpiar
    </button>
  </div>

  <div class="mb-6">
    <h4 class="text-xs font-semibold text-slate-500 mb-3 uppercase tracking-wider">Tipo de Recurso</h4>
    <div class="space-y-2">
      <label *ngFor="let type of availableTypes" class="flex items-center gap-3 cursor-pointer group">
        <div class="relative flex items-center justify-center w-5 h-5 border rounded bg-slate-950 transition-colors"
             [ngClass]="activeTypes.has(type) ? 'border-indigo-500 bg-indigo-500/20' : 'border-slate-700 group-hover:border-slate-500'">
          <svg *ngIf="activeTypes.has(type)" class="w-3 h-3 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <input type="checkbox" class="hidden" [checked]="activeTypes.has(type)" (change)="toggleType(type)">
        <span class="text-sm text-slate-300 group-hover:text-white transition-colors">{{ type }}</span>
      </label>
    </div>
  </div>

  <div>
    <h4 class="text-xs font-semibold text-slate-500 mb-3 uppercase tracking-wider">Dificultad</h4>
    <div class="space-y-2">
      <label *ngFor="let diff of availableDifficulties" class="flex items-center gap-3 cursor-pointer group">
        <div class="relative flex items-center justify-center w-5 h-5 border rounded bg-slate-950 transition-colors"
             [ngClass]="activeDifficulties.has(diff) ? 'border-indigo-500 bg-indigo-500/20' : 'border-slate-700 group-hover:border-slate-500'">
          <svg *ngIf="activeDifficulties.has(diff)" class="w-3 h-3 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <input type="checkbox" class="hidden" [checked]="activeDifficulties.has(diff)" (change)="toggleDifficulty(diff)">
        <span class="text-sm text-slate-300 group-hover:text-white transition-colors">{{ diff }}</span>
      </label>
    </div>
  </div>
</div>
