<div class="relative group my-6 bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
  
  <!-- Header del bloque -->
  <div class="flex items-center justify-between px-4 py-2 bg-slate-900 border-b border-slate-800">
    <span class="text-xs font-mono font-medium text-slate-400 uppercase tracking-wider">
      {{ language || 'text' }}
    </span>
    
    <button 
      (click)="copyToClipboard()"
      class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded-md transition-all duration-200"
      [ngClass]="copySuccess() ? 'bg-emerald-900/40 text-emerald-400' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white'">
      <span *ngIf="!copySuccess()">📋 Copiar</span>
      <span *ngIf="copySuccess()">✔️ Copiado</span>
    </button>
  </div>

  <!-- Contenido (Pre y Code) -->
  <pre class="p-4 overflow-x-auto text-sm text-slate-300 font-mono leading-relaxed"><code [ngClass]="'language-' + language">{{ code }}</code></pre>

</div>
