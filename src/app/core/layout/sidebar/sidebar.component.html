<aside 
  [class.w-72]="!sidebarCollapsed()" 
  [class.w-20]="sidebarCollapsed()" 
  class="hidden md:flex flex-col bg-slate-950 border-r border-slate-800 transition-all duration-300 relative z-30 sticky top-0 h-screen"
>
  <!-- Sidebar Header -->
  <div class="p-4 border-b border-slate-800 flex items-center justify-between">
    <a routerLink="/academy/home" class="flex items-center gap-3 overflow-hidden">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-500/20 shrink-0">
        DEV
      </div>
      <div *ngIf="!sidebarCollapsed()" class="flex flex-col">
        <span class="font-extrabold text-white text-base leading-tight tracking-tight">CASE Academy</span>
        <span class="text-xs text-indigo-400 font-medium">Software Engineering</span>
      </div>
    </a>
    <button 
      (click)="toggleSidebar()" 
      class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
      [title]="sidebarCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
    >
      <svg *ngIf="!sidebarCollapsed()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
      <svg *ngIf="sidebarCollapsed()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <!-- Navigation List -->
  <nav class="flex-1 overflow-y-auto p-3 space-y-4">
    <ng-container *ngFor="let section of sections">
      <div class="space-y-1">
        <div *ngIf="!sidebarCollapsed()" class="px-3 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">
          {{ section.title }}
        </div>
        
        <ng-container *ngFor="let item of section.items">
          <a 
            [routerLink]="item.path" 
            routerLinkActive="bg-indigo-600/10 text-indigo-400 font-semibold border-l-2 border-indigo-500 pl-2.5" 
            [class.border-transparent]="true"
            class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800/60 hover:text-white transition-all text-sm"
          >
            <span class="text-lg w-6 text-center">{{ item.icon }}</span>
            <span *ngIf="!sidebarCollapsed()" class="truncate flex-1">{{ item.title }}</span>
            <span *ngIf="!sidebarCollapsed() && item.state === 'COMING_SOON'" class="text-[9px] font-bold bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded uppercase">Pronto</span>
          </a>
        </ng-container>

        <!-- Especial para iterar módulos y sus clases si es la sección de Módulos -->
        <ng-container *ngIf="section.title === 'Módulos'">
          <div *ngFor="let mod of modules" class="mt-2">
            <div class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 text-sm font-medium">
              <span class="text-lg w-6 text-center">{{ mod.icon }}</span>
              <span *ngIf="!sidebarCollapsed()" class="truncate flex-1">{{ mod.title }}</span>
              <span *ngIf="!sidebarCollapsed() && mod.state === 'LOCKED'" class="text-[9px] font-bold bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded uppercase">Bloqueado</span>
            </div>
            <div *ngIf="!sidebarCollapsed() && mod.state === 'LIVE'" class="pl-7 pr-3 space-y-1 mt-1 border-l border-slate-800 ml-6">
              <a *ngFor="let lesson of mod.lessons"
                 [routerLink]="lesson.path" 
                 routerLinkActive="text-indigo-400 font-semibold" 
                 class="block px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all text-xs truncate">
                {{ lesson.icon }}: {{ lesson.title }}
              </a>
            </div>
          </div>
        </ng-container>

      </div>
      <div class="border-t border-slate-800/50"></div>
    </ng-container>
  </nav>

  <!-- Sidebar Footer -->
  <div class="p-3 border-t border-slate-800">
    <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800/60 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-xs shrink-0">
        💻
      </div>
      <div *ngIf="!sidebarCollapsed()" class="overflow-hidden">
        <p class="text-xs font-semibold text-white truncate">CASE Architect</p>
        <p class="text-[10px] text-indigo-300 font-medium truncate">Módulo 1 Activo</p>
      </div>
    </div>
  </div>
</aside>
