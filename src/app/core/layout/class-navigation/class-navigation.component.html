<div *ngIf="context()?.currentLesson" class="border-t border-slate-800 pt-6 mt-8 flex flex-col md:flex-row items-center justify-between gap-4">
  <div class="w-full md:w-1/3">
    <a *ngIf="context()?.previousLesson as prev" [routerLink]="prev.path" class="flex flex-col p-4 rounded-xl border border-slate-800 bg-slate-900/50 hover:bg-slate-800 transition-colors group">
      <span class="text-xs text-slate-500 font-bold uppercase mb-1 group-hover:text-slate-400">← Clase Anterior</span>
      <span class="text-sm font-semibold text-slate-300 truncate">{{ prev.title }}</span>
    </a>
  </div>

  <div class="w-full md:w-1/3 flex justify-center">
    <a routerLink="/plan-dev-detallado" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white transition-colors text-sm font-medium flex items-center gap-2">
      <span>↑</span> Volver al Módulo
    </a>
  </div>

  <div class="w-full md:w-1/3 text-right">
    <a *ngIf="context()?.nextLesson as next" [routerLink]="next.path" class="flex flex-col p-4 rounded-xl border border-slate-800 bg-slate-900/50 hover:bg-slate-800 transition-colors group items-end">
      <span class="text-xs text-slate-500 font-bold uppercase mb-1 group-hover:text-slate-400">Siguiente Clase →</span>
      <span class="text-sm font-semibold text-slate-300 truncate">{{ next.title }}</span>
    </a>
  </div>
</div>
