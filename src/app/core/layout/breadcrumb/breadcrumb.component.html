<nav *ngIf="context()?.currentLesson" class="flex text-sm text-slate-400 mb-6">
  <ol class="flex items-center space-x-2">
    <li>
      <a routerLink="/academy/home" class="hover:text-white transition-colors">Inicio</a>
    </li>
    <li class="flex items-center space-x-2">
      <span class="text-slate-600">/</span>
      <a [routerLink]="context()?.module?.lessons?.[0]?.path" class="hover:text-white transition-colors">{{ context()?.module?.title }}</a>
    </li>
    <li class="flex items-center space-x-2">
      <span class="text-slate-600">/</span>
      <span class="text-slate-200 font-medium">{{ context()?.currentLesson?.title }}</span>
    </li>
  </ol>
</nav>
